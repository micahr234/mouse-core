name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # TEMPORARY: keep GIL off while Triton re-enables it on import.
      # Remove once Triton declares Py_MOD_GIL_NOT_USED — see CONTRIBUTING.md.
      PYTHON_GIL: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install free-threaded Python and package
        run: |
          uv python install 3.15t
          uv venv --python 3.15t
          # torch 2.15 cp315t wheels are on the PyTorch test index, not PyPI.
          # The CPU index keeps CI from fetching a CUDA wheel. unsafe-best-match
          # is required so PyPI still supplies packages the test index also hosts
          # (numpy) at the versions this project requires.
          uv pip install -e ".[dev]" --python .venv/bin/python \
            --extra-index-url https://download.pytorch.org/whl/test/cpu \
            --index-strategy unsafe-best-match

      - name: Type check
        run: .venv/bin/pyright src/ tests/

      - name: Run tests
        run: .venv/bin/pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install free-threaded Python and build tools
        run: |
          uv python install 3.15t
          uv venv --python 3.15t
          uv pip install "build>=1.6.1" "twine>=7.0.0" --python .venv/bin/python

      - name: Build wheel and sdist
        run: .venv/bin/python -m build

      - name: Validate distributions
        run: .venv/bin/python -m twine check dist/*
